  # mosh 1.4+ carries RGB color and OSC 52 clipboard writes.
  set -g default-terminal 'tmux-256color'
  set -s terminal-features[100] 'xterm*:RGB'
  set -s escape-time 10
  set -g focus-events on
  set -s set-clipboard on
  set -g prefix C-a
  unbind C-b
  bind C-a send-prefix
  set -g mouse on
  set -g history-limit 100000

  # Solarized Dark - Vivid, matching Rex and Neovim (priority 5).
  set -g status-style 'bg=default,fg=#91a8aa'
  set -g status-left-style 'bg=#32b9aa,fg=#031219,bold'
  set -g status-right-style 'bg=default,fg=#6e8b95'
  set -g window-status-style 'bg=default,fg=#6e8b95'
  set -g window-status-current-style 'bg=#529ef9,fg=#031219,bold'
  set -g pane-border-style 'fg=#002831'
  set -g pane-active-border-style 'fg=#529ef9'
  set -g message-style 'bg=#002831,fg=#91a8aa'
  set -g mode-style 'bg=#529ef9,fg=#031219,bold'

  # Scroll myszką wchodzi w copy-mode i przewija bufor tmuxa
  bind -T root WheelUpPane if-shell -F '#{alternate_on}' \
    'send-keys -M' \
    'copy-mode -e; send-keys -X scroll-up'

  bind -T root WheelDownPane if-shell -F '#{pane_in_mode}' \
    'send-keys -X scroll-down' \
    'send-keys -M'

