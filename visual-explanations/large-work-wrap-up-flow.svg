<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title description">
  <title id="title">Large work wrap-up skill flow</title>
  <desc id="description">A request to conclude substantial work loads the large-work-wrap-up skill, which reviews evidence from the work and returns two reflective answers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="85" width="190" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="120" font-size="17" fill="#172554">User requests a wrap-up</text>
    <text x="130" y="145" font-size="14" fill="#172554">after substantial work</text>
    <line x1="225" y1="130" x2="325" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="330" y="65" width="240" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="450" y="105" font-size="17" fill="#2e1065">large-work-wrap-up</text>
    <text x="450" y="133" font-size="14" fill="#2e1065">reviews artifacts, tests,</text>
    <text x="450" y="155" font-size="14" fill="#2e1065">decisions, and unknowns</text>
    <line x1="570" y1="130" x2="670" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="675" y="65" width="190" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="770" y="102" font-size="16" fill="#14532d">Two evidence-based</text>
    <text x="770" y="126" font-size="16" fill="#14532d">answers:</text>
    <text x="770" y="151" font-size="13" fill="#14532d">least confidence</text>
    <text x="770" y="171" font-size="13" fill="#14532d">missing context</text>
  </g>
</svg>
