<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="title description">
  <title id="title">Visual explanation cleanup secret flow</title>
  <desc id="description">On a main branch push, the caller workflow passes the REMOVE_VISUALS_MAIN secret to the reusable cleanup workflow, which removes PR-only SVG files.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="920" height="250" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="35" y="80" width="190" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="116" font-size="17" fill="#172554">Push to main</text>
    <text x="130" y="140" font-size="14" fill="#172554">triggers caller workflow</text>
    <line x1="225" y1="125" x2="325" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="330" y="55" width="260" height="140" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="460" y="91" font-size="16" fill="#78350f">Caller passes</text>
    <text x="460" y="116" font-size="16" fill="#78350f">REMOVE_VISUALS_MAIN</text>
    <text x="460" y="143" font-size="14" fill="#78350f">to reusable workflow</text>
    <line x1="590" y1="125" x2="690" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="695" y="55" width="190" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="790" y="91" font-size="16" fill="#14532d">Reusable workflow</text>
    <text x="790" y="118" font-size="14" fill="#14532d">deletes SVG files</text>
    <text x="790" y="141" font-size="14" fill="#14532d">and empty directory</text>
  </g>
</svg>
